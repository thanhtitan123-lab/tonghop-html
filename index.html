<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

  <style>
  body {
    /* Gradient động hoặc màu sắc hiện đại hơn */
    background: linear-gradient(135deg, #535974 0%, #7c7782 100%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    margin: 0;
    overflow-x: hidden;
  }

  #menu-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    padding: 20px;
  }

  .main-card {
    border: none;
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    background: rgba(255, 255, 255, 0.95);
    padding: 50px 40px;
    max-width: 450px;
    width: 100%;
    text-align: center;
    transition: transform 0.3s ease;

  }

  h2 {
    font-weight: 700;
    color: #2d3436;
    margin-bottom: 10px;
  }

  p { color: #636e72; margin-bottom: 30px; }

  /* Hiệu ứng cho từng mục bài tập */
  .panel-default {
    border: 1px solid #eee !important;
    border-radius: 12px !important;
    margin-bottom: 15px !important;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    overflow: hidden;
  }

  .panel-default:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    border-color: #764ba2 !important;
  }

  .panel-heading {
    padding: 15px 20px !important;
    background-color: transparent !important;
    transition: background 0.3s;
  }

  .panel-heading:hover {
    background-color: #f8f9fa !important;
  }

  .panel-title {
    font-size: 16px;
    font-weight: 600;
    color: #444;
    display: flex;
    align-items: center;
  }

  /* Thêm icon giả bằng CSS hoặc dùng FontAwesome */
  .panel-title::before {
    content: "📁";
    margin-right: 15px;
    font-size: 18px;
  }

  /* NÚT QUAY LẠI */
  #back-btn {
    display: none;
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 9999;
    padding: 12px 25px;
    border-radius: 50px;
    background: #fff;
    border: none;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    cursor: pointer;
    font-weight: bold;
    color: #764ba2;
    transition: all 0.3s;
  }

  #back-btn:hover {
    background: #764ba2;
    color: #fff;
  }

  #content-frame {
    display: none;
    width: 100%;
    height: 100vh;
    border: none;
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

</head>
<body>
  <button id="back-btn" onclick="goBack()">← Quay lại Menu</button>

  <div id="menu-wrapper">
    <div class="container main-card">
      <h2>Danh sách các bài tập</h2>
      <p>Chọn mục bên dưới để xem nội dung</p>                                          
 <!-- Thay thế Dropdown bằng Panel Group -->
      <div class="panel-group">
        
        <div class="panel panel-default">
          <div class="panel-heading" onclick="showPage('https://thanhtitan123-lab.github.io/web-html-baitap1/')">
            <h4 class="panel-title">Xem Bài thơ</h4>
          </div>
        </div>

        <div class="panel panel-default">
          <div class="panel-heading" onclick="showPage('https://thanhtitan123-lab.github.io/baitap/')">
            <h4 class="panel-title">Xem Bài nhạc</h4>
          </div>
        </div>

        <div class="panel panel-default">
          <div class="panel-heading" onclick="showPage('https://thanhtitan123-lab.github.io/gioithieubanthan-html/')">
            <h4 class="panel-title">Giới thiệu bản thân</h4>
          </div>
        </div>

      </div>
    </div>
  </div>

  <iframe id="content-frame"></iframe>

  <script>
    function showPage(url) {
      // Ẩn menu chính
      document.getElementById('menu-wrapper').style.display = 'none';
      // Hiện iframe và gán link
      var frame = document.getElementById('content-frame');
      frame.src = url;
      frame.style.display = 'block';
      // Hiện nút quay lại
      document.getElementById('back-btn').style.display = 'block';
    }

    function goBack() {
      // Hiện lại menu chính
      document.getElementById('menu-wrapper').style.display = 'flex';
      // Ẩn iframe và xóa src
      var frame = document.getElementById('content-frame');
      frame.style.display = 'none';
      frame.src = '';
      // Ẩn nút quay lại
      document.getElementById('back-btn').style.display = 'none';
    }
  </script>

</body>
</html>
